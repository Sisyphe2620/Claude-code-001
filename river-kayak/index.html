<title>激流皮艇大赛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Full-bleed 3D canvas; HUD pinned to the four corners, overlays centered on a river-water glass panel */
:root{
  --ink:#08262e;
  --panel:rgba(5,34,42,.66);
  --panel-edge:rgba(170,235,240,.22);
  --text:#f2fbfb;
  --muted:#a6d2d6;
  --vest:#ff7a1a;
  --boost:#3fd0ff;
  --moss:#7ad35a;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:var(--body);-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-box{position:fixed;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hud .tl{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:8px 16px 10px;display:grid;gap:2px;min-width:96px}
#pos{font-family:var(--display);font-size:52px;line-height:1;color:var(--vest)}
#pos span{font-size:24px;color:var(--muted)}
.lab{font-size:12px;letter-spacing:.12em;color:var(--muted)}
#spd{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
#spd small{font-family:var(--body);font-size:12px;color:var(--muted)}
#hud .tr{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));padding:8px;display:grid;gap:6px;justify-items:end}
#time{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;padding-inline:6px}
#map{width:128px;height:128px;display:block}
#track{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(36vw,360px);height:10px;border-radius:6px;background:rgba(5,34,42,.6);border:1px solid var(--panel-edge)}
#track .flag{position:absolute;right:-6px;top:-7px;width:22px;height:22px;border-radius:4px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 0 0/11px 11px;border:1px solid #fff}
#track .dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-sizing:border-box}
#track .dot.me{width:18px;height:18px;margin:-9px 0 0 -9px;z-index:2;box-shadow:0 0 0 3px rgba(255,122,26,.4)}
#itemBox{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 14px;display:flex;align-items:center;gap:12px}
#itemSlot{width:64px;height:64px;border-radius:12px;border:2px dashed var(--panel-edge);display:grid;place-items:center;font-family:var(--display);font-size:18px;text-align:center;line-height:1.1}
#itemSlot.full{border:2px solid var(--boost);background:rgba(63,208,255,.18)}
#itemSlot.wave{border-color:#fff;background:rgba(255,255,255,.16)}
.itemkey{font-size:12px;color:var(--muted);display:grid;gap:6px}
#driftBar{width:110px;height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#driftBar i{display:block;height:100%;width:0;background:var(--muted)}
#msg{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--display);font-size:clamp(40px,10vw,96px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 30px rgba(63,208,255,.5);pointer-events:none;opacity:0;transition:opacity .2s}
#msg.show{opacity:1}
#msg.small{font-size:clamp(24px,5vw,44px)}
.overlay{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(4,30,38,.25),rgba(4,30,38,.7));overflow:auto}
.card{width:min(560px,100%);box-sizing:border-box;background:var(--panel);border:1px solid var(--panel-edge);border-radius:20px;padding:28px 28px 24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;gap:18px}
.card h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,64px);line-height:1;color:var(--text);text-wrap:balance}
.card h1 em{font-style:normal;color:var(--vest)}
.sub{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;align-items:center}
kbd{font-family:var(--body);font-size:12px;padding:3px 7px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid var(--panel-edge);border-bottom-width:3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--panel-edge)}
.chip b{font-weight:600}
.go{font-family:var(--display);font-size:26px;border:0;border-radius:14px;padding:14px 20px;background:var(--vest);color:#2a0d00;cursor:pointer;box-shadow:0 5px 0 #b44a00}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b44a00}
.go:focus-visible,.tbtn:focus-visible{outline:3px solid var(--boost);outline-offset:3px}
.place{font-family:var(--display);font-size:72px;line-height:1;color:var(--vest)}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
td{padding:7px 4px;border-bottom:1px solid var(--panel-edge)}
td:last-child{text-align:right}
tr.me td{color:var(--vest);font-weight:600}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
#touch .tbtn{position:fixed;width:74px;height:74px;border-radius:50%;background:var(--panel);border:2px solid var(--panel-edge);color:var(--text);font-family:var(--display);font-size:20px;display:grid;place-items:center;touch-action:none}
#touch .tbtn.on{background:rgba(63,208,255,.35);border-color:var(--boost)}
#tL{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#tR{left:calc(max(16px,env(safe-area-inset-left,0px)) + 86px);bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#tItem{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#tDrift{right:calc(max(16px,env(safe-area-inset-right,0px)) + 86px);bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#tBrake{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(106px + env(safe-area-inset-bottom,0px));width:56px!important;height:56px!important;font-size:16px!important}
body.touch #itemBox{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.touch .itemkey .k{display:none}
@media (max-width:520px){
  #pos{font-size:40px}#map{width:96px;height:96px}#time{font-size:20px}
  #track{top:calc(150px + env(safe-area-inset-top,0px));width:70vw}
}
@media (prefers-reduced-motion:reduce){#msg{transition:none}}
</style>

<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="hud-box tl"><div id="pos">6<span>/6</span></div><div class="lab">名次</div><div id="spd">0<small> km/h</small></div></div>
  <div class="hud-box tr"><div id="time">0:00.00</div><canvas id="map" width="256" height="256"></canvas></div>
  <div id="track"><div class="flag"></div></div>
  <div class="hud-box" id="itemBox">
    <div id="itemSlot">空</div>
    <div class="itemkey"><span class="k"><kbd>空格</kbd> 使用道具</span><span>漂移蓄力</span><div id="driftBar"><i></i></div></div>
  </div>
</div>
<div id="msg"></div>

<div id="touch" hidden>
  <button class="tbtn" id="tL" aria-label="左转">◀</button>
  <button class="tbtn" id="tR" aria-label="右转">▶</button>
  <button class="tbtn" id="tDrift">漂移</button>
  <button class="tbtn" id="tItem">道具</button>
  <button class="tbtn" id="tBrake">倒划</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>激流<em>皮艇</em>大赛</h1>
    <p class="sub">六条皮艇顺着峡谷河道一路冲下去，躲开礁石，抢道具，第一个冲过终点的拿冠军。</p>
    <div class="keys" id="keyHelp">
      <kbd>W / ↑</kbd><span>划桨前进</span>
      <kbd>A D / ← →</kbd><span>转向</span>
      <kbd>Shift</kbd><span>转弯时按住漂移，松开获得加速（越久越强）</span>
      <kbd>空格</kbd><span>使用道具</span>
      <kbd>S / ↓</kbd><span>倒划减速</span>
    </div>
    <p class="sub" id="touchHelp" hidden>手机上自动划桨：左下角转向，右下角漂移和道具。</p>
    <div class="legend">
      <span class="chip"><b>? 箱子</b> 随机道具</span>
      <span class="chip"><b>绿箭头</b> 加速带</span>
      <span class="chip"><b>白色急流</b> 水流更快</span>
      <span class="chip"><b>礁石</b> 撞上会减速</span>
    </div>
    <button class="go" id="startBtn">开始比赛</button>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="card">
    <div class="lab">比赛结束</div>
    <div class="place" id="placeTxt">第 1 名</div>
    <table id="resTable"></table>
    <button class="go" id="againBtn">再来一局</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
// ---------- helpers ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rand = mulberry32(20261120);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t)};

// ---------- renderer ----------
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const SKY=new THREE.Color(0xa8dbe8);
scene.background=SKY;
scene.fog=new THREE.Fog(SKY,80,430);
const camera=new THREE.PerspectiveCamera(68,1,0.1,1200);
scene.add(new THREE.HemisphereLight(0xe6f8ff,0x3a5a2a,0.9));
const sun=new THREE.DirectionalLight(0xfff0d0,0.85);sun.position.set(90,160,30);scene.add(sun);

function canvasTex(w,h,draw,repeat=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}
function tiled(g,w,h,fn){for(const ox of[-w,0,w])for(const oy of[-h,0,h]){g.save();g.translate(ox,oy);fn();g.restore();}}

// ---------- river path ----------
const ctrl=[];let cx=0,cz=0,ang=0;
for(let i=0;i<64;i++){ctrl.push(new THREE.Vector3(cx,0,cz));if(i>2)ang+=(rand()-0.5)*0.6;ang=clamp(ang*0.96,-0.95,0.95);cx+=Math.sin(ang)*38;cz-=Math.cos(ang)*38;}
const curve=new THREE.CatmullRomCurve3(ctrl,false,'centripetal');
const L=curve.getLength();
const N=Math.round(L);
const SP=curve.getSpacedPoints(N);
const uStart=30, uF=L-200;
const RAPIDS=[[0.17,0.22],[0.40,0.46],[0.61,0.655],[0.79,0.85]].map(([a,b])=>[a*uF,b*uF]);
function rapidAt(u){let r=0;for(const[a,b]of RAPIDS)r=Math.max(r,smooth(a-25,a+10,u)*(1-smooth(b-10,b+25,u)));return r;}
const PX=new Float32Array(N+1),PY=new Float32Array(N+1),PZ=new Float32Array(N+1),TX=new Float32Array(N+1),TZ=new Float32Array(N+1),HW=new Float32Array(N+1),RF=new Float32Array(N+1);
for(let i=0;i<=N;i++){
  const u=i*L/N;PX[i]=SP[i].x;PZ[i]=SP[i].z;
  const a=SP[Math.max(0,i-1)],b=SP[Math.min(N,i+1)];let tx=b.x-a.x,tz=b.z-a.z;const l=Math.hypot(tx,tz)||1;TX[i]=tx/l;TZ[i]=tz/l;
  const rf=rapidAt(u);RF[i]=rf;
  HW[i]=(15+3.5*Math.sin(u*0.0123)+2.5*Math.sin(u*0.031+1))*(1-0.3*rf)+Math.max(0,8-u*0.1);
  PY[i]=i?PY[i-1]-(0.012+0.07*rf)*(L/N):0;
}
function sample(u,o){const f=clamp(u,0,L)/L*N;let i=Math.floor(f);if(i>=N)i=N-1;const t=f-i,j=i+1;
  o.x=PX[i]+(PX[j]-PX[i])*t;o.y=PY[i]+(PY[j]-PY[i])*t;o.z=PZ[i]+(PZ[j]-PZ[i])*t;
  let tx=TX[i]+(TX[j]-TX[i])*t,tz=TZ[i]+(TZ[j]-TZ[i])*t;const l=Math.hypot(tx,tz)||1;o.tx=tx/l;o.tz=tz/l;
  o.hw=HW[i]+(HW[j]-HW[i])*t;o.rf=RF[i]+(RF[j]-RF[i])*t;o.cur=5+9*o.rf;return o;}
function toWorld(u,lat,o){sample(u,o);o.wx=o.x-o.tz*lat;o.wz=o.z+o.tx*lat;return o;}

// ---------- strip geometry builder ----------
function buildStrip(step,cols,colorFn,vScale){
  const us=[];for(let u=0;u<L;u+=step)us.push(u);us.push(L);
  const R=us.length,C=cols.length,pos=new Float32Array(R*C*3),uv=new Float32Array(R*C*2),col=new Float32Array(R*C*3),s={};
  for(let r=0;r<R;r++){sample(us[r],s);const rx=-s.tz,rz=s.tx;
    for(let c=0;c<C;c++){const[lat,dy,uu]=cols[c](s,us[r]);const k=r*C+c;
      pos[k*3]=s.x+rx*lat;pos[k*3+1]=s.y+dy;pos[k*3+2]=s.z+rz*lat;uv[k*2]=uu;uv[k*2+1]=us[r]/vScale;
      const cc=colorFn(s,c,us[r]);col[k*3]=cc[0];col[k*3+1]=cc[1];col[k*3+2]=cc[2];}}
  const idx=[];for(let r=0;r<R-1;r++)for(let c=0;c<C-1;c++){const a=r*C+c,b=a+1,d=a+C,e=d+1;idx.push(a,b,d,b,e,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();return g;}

// water
const waterTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#2a8299';g.fillRect(0,0,w,h);const r2=mulberry32(7);
  for(let i=0;i<170;i++){const x=r2()*w,y=r2()*h,rw=1.5+r2()*5,rh=8+r2()*36,light=r2()<.55,a=0.1+r2()*0.22;
    tiled(g,w,h,()=>{g.fillStyle=light?`rgba(215,248,255,${a})`:`rgba(18,92,118,${a})`;g.beginPath();g.ellipse(x,y,rw,rh,0,0,Math.PI*2);g.fill();});}});
const WC=9,waterCols=[];for(let c=0;c<WC;c++)waterCols.push((s)=>{const f=c/(WC-1);return[lerp(-(s.hw+3),s.hw+3,f),0,f*3];});
const waterGeo=buildStrip(2,waterCols,(s,c)=>{const e=Math.abs(c/(WC-1)*2-1);return[lerp(0.72,0.9,e*e),lerp(0.86,0.95,e*e),lerp(0.95,0.82,e*e)];},18);
const water=new THREE.Mesh(waterGeo,new THREE.MeshStandardMaterial({map:waterTex,vertexColors:true,roughness:0.28,metalness:0.08}));scene.add(water);

// rapids foam (additive, faded by vertex color)
const foamTex=canvasTex(256,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);const r2=mulberry32(11);
  for(let i=0;i<120;i++){const x=r2()*w,y=r2()*h,rw=3+r2()*12,rh=6+r2()*30,a=0.3+r2()*0.6;tiled(g,w,h,()=>{g.fillStyle=`rgba(255,255,255,${a})`;g.beginPath();g.ellipse(x,y,rw,rh,r2()*0.4,0,Math.PI*2);g.fill();});}});
const foamCols=[];for(let c=0;c<7;c++)foamCols.push((s)=>{const f=c/6;return[lerp(-(s.hw+1),s.hw+1,f),0.05,f*2.5];});
const foamGeo=buildStrip(2,foamCols,(s,c)=>{const e=1-Math.abs(c/6*2-1)*0.3;const k=s.rf*0.85*e;return[k,k,k];},11);
const foam=new THREE.Mesh(foamGeo,new THREE.MeshBasicMaterial({map:foamTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:true}));scene.add(foam);
// gentle edge foam everywhere
const edgeGeo=buildStrip(2,[(s)=>[-(s.hw+0.2),0.04,0],(s)=>[-(s.hw-1.6),0.04,0.5],(s)=>[s.hw-1.6,0.04,0.5],(s)=>[s.hw+0.2,0.04,1]],(s,c)=>{const k=(c===0||c===3)?0.35:0;return[k,k,k];},6);
scene.add(new THREE.Mesh(edgeGeo,new THREE.MeshBasicMaterial({map:foamTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false})));

// banks
const PROFILE=[[-1.8,-1.1],[0.6,0.35],[4,2.2],[14,3.4],[32,6.5],[62,17]];
function bankNoise(u,side){return Math.sin(u*0.021+side*1.7)*2.2+Math.sin(u*0.0057+side)*4;}
function bankY(u,side,off){let y=PROFILE[0][1];for(let k=1;k<PROFILE.length;k++){const[o1,y1]=PROFILE[k-1],[o2,y2]=PROFILE[k];if(off<=o2){y=lerp(y1,y2,clamp((off-o1)/(o2-o1),0,1));break;}y=y2;}
  return y+bankNoise(u,side)*clamp((off-10)/30,0,1);}
const BANKC=[[0.74,0.68,0.54],[0.66,0.62,0.52],[0.45,0.56,0.32],[0.36,0.58,0.27],[0.29,0.5,0.23],[0.33,0.47,0.3]];
const ROCKC=[0.52,0.52,0.5];
for(const side of[-1,1]){
  const order=side<0?[...PROFILE.keys()].reverse():[...PROFILE.keys()];
  const cols=order.map(k=>(s,u)=>[side*(s.hw+PROFILE[k][0]),bankY(u,side,PROFILE[k][0]),k]);
  const geo=buildStrip(3,cols,(s,c,u)=>{const k=order[c];let col=BANKC[k];if(k>=1&&k<=2&&s.rf>0.1)col=col.map((v,i)=>lerp(v,ROCKC[i],s.rf));const n=0.9+0.1*Math.sin(u*0.13+k*3);return col.map(v=>v*n);},10);
  scene.add(new THREE.Mesh(geo,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})));
}

// trees, bank rocks, mountains
const tmpM=new THREE.Matrix4(),tmpQ=new THREE.Quaternion(),tmpS=new THREE.Vector3(),tmpP=new THREE.Vector3(),UP=new THREE.Vector3(0,1,0);
const TREES=900;
const trunkMesh=new THREE.InstancedMesh(new THREE.CylinderGeometry(0.25,0.35,2,6),new THREE.MeshLambertMaterial({color:0x6b4a2e}),TREES);
const leafMesh=new THREE.InstancedMesh(new THREE.ConeGeometry(2,6,7),new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}),TREES);
const leafCols=[0x2f6b3a,0x3d7d3a,0x285c35,0x4c8a3c];const tc=new THREE.Color();
{const s={};for(let i=0;i<TREES;i++){const u=rand()*L,side=rand()<.5?-1:1,off=7+Math.pow(rand(),1.4)*50;toWorld(u,side*0,s);const lat=side*(s.hw+off);toWorld(u,lat,s);
  const y=s.y+bankY(u,side,off),sc=0.7+rand()*0.9;
  tmpQ.setFromAxisAngle(UP,rand()*6.28);tmpS.set(sc,sc,sc);tmpP.set(s.wx,y+1*sc,s.wz);tmpM.compose(tmpP,tmpQ,tmpS);trunkMesh.setMatrixAt(i,tmpM);
  tmpS.set(sc,sc*(0.8+rand()*0.5),sc);tmpP.set(s.wx,y+(2+3)*sc,s.wz);tmpM.compose(tmpP,tmpQ,tmpS);leafMesh.setMatrixAt(i,tmpM);
  tc.setHex(leafCols[i%4]);leafMesh.setColorAt(i,tc);}}

const sp={};
function physics(b,dt){
  sample(b.u,sp);
  const ctrl=b.stunT>0?0.25:1;
  const maxV=MAXV*b.skill*b.rubber;
  const turnK=TURN*(0.35+0.65*Math.min(1,Math.abs(b.v)/12));
  // drift
  if(b.wantDrift&&!b.drift.on&&Math.abs(b.steer)>0.3&&b.v>10){b.drift.on=true;b.drift.dir=Math.sign(b.steer);b.drift.charge=0;}
  if(b.drift.on&&(!b.wantDrift||b.v<6||b.stunT>0)){const c=b.drift.charge;if(c>2){b.boostT=Math.max(b.boostT,1.3);b.boostTier=2;if(b.isPlayer)say('超级漂移加速！',0.7,true);}else if(c>1){b.boostT=Math.max(b.boostT,0.7);b.boostTier=1;}b.drift.on=false;b.drift.charge=0;}
  if(b.drift.on){b.h+=(b.drift.dir*0.75+b.steer*0.55)*turnK*dt*ctrl;b.drift.charge+=dt*(0.8+0.5*Math.abs(b.steer));}
  else b.h+=b.steer*turnK*dt*ctrl;
  b.h-=b.h*0.35*dt;b.h=clamp(b.h,-1.3,1.3);
  if(b.spin>0){b.spin=Math.max(0,b.spin-dt*1.2);}
  // speed
  if(b.boostT>0){b.boostT-=dt;b.v=Math.max(b.v,lerp(b.v,maxV+BOOSTV,1-Math.exp(-6*dt)));}
  b.v+=(b.throttle>0?ACC*b.throttle:BRAKE*b.throttle)*dt*ctrl;
  b.v-=b.v*(ACC/maxV)*dt;
  if(b.drift.on)b.v-=b.v*0.1*dt;
  b.v=clamp(b.v,-5,maxV+BOOSTV+4);
  b.stunT=Math.max(0,b.stunT-dt);
  // move
  b.u+=(b.v*Math.cos(b.h)+sp.cur)*dt;
  b.x+=b.v*Math.sin(b.h)*dt;
  if(b.u>L-15){b.u=L-15;b.v*=0.9;}
  // banks
  const lim=sp.hw-1.3;
  if(Math.abs(b.x)>lim){const sd=Math.sign(b.x);const impact=Math.abs(b.v*Math.sin(b.h));b.x=sd*lim;if(Math.sign(b.h)===sd)b.h*=-0.35;b.v-=b.v*2.2*dt;
    if(b.isPlayer&&impact>6){shake=Math.max(shake,0.25);const s=toWorld(b.u,b.x,{});burst(s.wx,s.y+0.4,s.wz,12,0.95,0.95,0.9,4);}}
  // rocks
  for(const r of rocks){const du=b.u-r.u;if(du>6||du<-6)continue;const dx=b.x-r.x;const d=Math.hypot(du,dx)||0.01,m=r.r+0.95;
    if(d<m){b.u=r.u+du/d*m;b.x=r.x+dx/d*m;if(b.v>5){const s=toWorld(b.u,b.x,{});burst(s.wx,s.y+0.5,s.wz,24,0.95,0.98,1,6);b.v*=0.35;b.stunT=0.55;b.spin=0.6;b.drift.on=false;
      if(b.isPlayer){shake=0.45;say('撞礁石！',0.7,true);}}b.h+=dx/d*0.5;}}
  // boxes
  for(const bx of boxes){if(!bx.active)continue;if(Math.abs(b.u-bx.u)<2.1&&Math.abs(b.x-bx.x)<2.1){bx.active=false;bx.mesh.visible=false;bx.t=5;
    burst(bx.mesh.position.x,bx.mesh.position.y,bx.mesh.position.z,20,1,0.8,0.3,4);if(!b.item)giveItem(b,b.place||0);}}
  // pads
  for(const p of pads){if(Math.abs(b.u-p.u)<4.4&&Math.abs(b.x-p.x)<2.5){if(b.boostT<0.9){b.boostT=0.9;b.boostTier=1;}}}
  // finish
  if(b.finishTime==null&&b.u>=uF){b.finishTime=raceTime;if(b.isPlayer)onPlayerFinish();}
}
function boatCollisions(){for(let i=0;i<racers.length;i++)for(let j=i+1;j<racers.length;j++){const a=racers[i],b=racers[j];const du=a.u-b.u,dx=a.x-b.x;if(Math.abs(du)>3.5)continue;
  const d=Math.hypot(du*0.7,dx)||0.01;if(d<1.8){const push=(1.8-d)/2;const nu=du*0.7/d,nx=dx/d;a.u+=nu*push;b.u-=nu*push;a.x+=nx*push;b.x-=nx*push;const av=(a.v+b.v)/2;a.v=lerp(a.v,av,0.3);b.v=lerp(b.v,av,0.3);}}}

// ---------- visuals per racer ----------
const sv={};
function updateMesh(b,dt){
  sample(b.u,sv);const rx=-sv.tz,rz=sv.tx;
  const px=sv.x+rx*b.x,pz=sv.z+rz*b.x;
  const bob=Math.sin(time*3+b.seed)*0.06*(1+sv.rf*4);
  b.mesh.position.set(px,sv.y+bob,pz);
  const c=Math.cos(b.h),s=Math.sin(b.h);b.dirx=sv.tx*c+rx*s;b.dirz=sv.tz*c+rz*s;b.rx=rx;b.rz=rz;b.wy=sv.y;
  b.visDrift=lerp(b.visDrift,b.drift.on?b.drift.dir*0.42:0,1-Math.exp(-8*dt));
  b.roll=lerp(b.roll,-b.steer*0.14-(b.drift.on?b.drift.dir*0.12:0),1-Math.exp(-6*dt));
  b.mesh.rotation.set(Math.sin(time*2.2+b.seed)*0.03*(1+sv.rf*3),Math.atan2(-b.dirx,-b.dirz)-b.visDrift+b.spin*Math.PI*2,b.roll+Math.sin(time*1.7+b.seed)*0.03);
  const stroke=state==='race'||state==='finished'?Math.max(0.25,b.throttle):0.15;
  b.phase+=dt*(3.2+Math.max(0,b.v)*0.16)*stroke;
  b.paddle.rotation.z=Math.sin(b.phase)*0.55;b.paddle.rotation.y=Math.cos(b.phase)*0.4;
  // spray
  const near=Math.hypot(px-camera.position.x,pz-camera.position.z)<70;
  if(near&&(state==='race'||state==='finished')){const spd=b.v+sv.cur;
    if(spd>12&&Math.random()<dt*(18+sv.rf*30)){for(const sd of[-1,1])emit(px-b.dirx*1.6+rx*sd*0.7,sv.y+0.2,pz-b.dirz*1.6+rz*sd*0.7,rx*sd*1.6-b.dirx*2,1.5+Math.random()*2,rz*sd*1.6-b.dirz*2,0.92,0.98,1,0.5);}
    if(Math.sin(b.phase)>0.9&&Math.random()<0.5){const sd=Math.sin(b.phase*0.5)>0?1:-1;emit(px+rx*sd*1.6,sv.y+0.3,pz+rz*sd*1.6,rx*sd,2.2,rz*sd,0.9,0.97,1,0.45);}
    if(b.drift.on&&b.drift.charge>0.3){const col=b.drift.charge>2?[1,0.55,0.15]:b.drift.charge>1?[0.3,0.82,1]:[0.95,0.95,0.95];
      for(let k=0;k<2;k++)emit(px-b.dirx*1.9-rx*b.drift.dir*0.6,sv.y+0.25,pz-b.dirz*1.9-rz*b.drift.dir*0.6,(Math.random()-0.5)*3-rx*b.drift.dir*2,2+Math.random()*2,(Math.random()-0.5)*3-rz*b.drift.dir*2,col[0],col[1],col[2],0.4);}
    if(b.boostT>0){const col=b.boostTier>=2?[1,0.6,0.2]:[0.35,0.85,1];for(let k=0;k<3;k++)emit(px-b.dirx*2.2+(Math.random()-0.5),sv.y+0.4,pz-b.dirz*2.2+(Math.random()-0.5),-b.dirx*4,1+Math.random()*2,-b.dirz*4,col[0],col[1],col[2],0.35);}
  }
}

// ---------- minimap ----------
const mapC=document.getElementById('map'),mctx=mapC.getContext('2d');
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;for(let i=0;i<=N;i++){if(i*L/N>uF+30)break;minX=Math.min(minX,PX[i]);maxX=Math.max(maxX,PX[i]);minZ=Math.min(minZ,PZ[i]);maxZ=Math.max(maxZ,PZ[i]);}
const mpad=22,msc=Math.min((256-2*mpad)/(maxX-minX||1),(256-2*mpad)/(maxZ-minZ||1));
const mox=(256-(maxX-minX)*msc)/2,moz=(256-(maxZ-minZ)*msc)/2;
const mxp=x=>mox+(x-minX)*msc,mzp=z=>moz+(z-minZ)*msc;
const mapBase=document.createElement('canvas');mapBase.width=mapBase.height=256;
{const g=mapBase.getContext('2d');g.lineCap=g.lineJoin='round';const end=Math.floor(uF/L*N);
 g.strokeStyle='rgba(10,50,60,.9)';g.lineWidth=14;g.beginPath();for(let i=0;i<=end;i+=4)i?g.lineTo(mxp(PX[i]),mzp(PZ[i])):g.moveTo(mxp(PX[i]),mzp(PZ[i]));g.stroke();
 g.strokeStyle='#5fc8dc';g.lineWidth=7;g.stroke();
 g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=7;for(const[a,b]of RAPIDS){g.beginPath();for(let i=Math.floor(a/L*N);i<=Math.floor(b/L*N);i+=3)g.lineTo(mxp(PX[i]),mzp(PZ[i]));g.stroke();}
 g.fillStyle='#fff';g.fillRect(mxp(PX[end])-7,mzp(PZ[end])-7,14,14);g.fillStyle='#111';g.fillRect(mxp(PX[end])-7,mzp(PZ[end])-7,7,7);g.fillRect(mxp(PX[end]),mzp(PZ[end]),7,7);}
const sm={};
function drawMap(){mctx.clearRect(0,0,256,256);mctx.drawImage(mapBase,0,0);
  for(const r of racers.slice().reverse()){toWorld(r.u,r.x,sm);mctx.fillStyle=r.css;mctx.strokeStyle='#fff';mctx.lineWidth=3;mctx.beginPath();mctx.arc(mxp(sm.wx),mzp(sm.wz),r.isPlayer?9:6,0,7);mctx.fill();mctx.stroke();}}

// ---------- flow ----------
const hud=document.getElementById('hud'),menu=document.getElementById('menu'),result=document.getElementById('result'),touchEl=document.getElementById('touch');
function startRace(){resetRace();state='countdown';countT=3.6;menu.hidden=true;result.hidden=true;hud.hidden=false;touchEl.hidden=!isTouch;}
document.getElementById('startBtn').addEventListener('click',startRace);
document.getElementById('againBtn').addEventListener('click',startRace);
function onPlayerFinish(){state='finished';resultT=3.5;const place=standings().indexOf(player)+1;say(place===1?'冠军！':`第 ${place} 名`,2.5);}
function standings(){return racers.slice().sort((a,b)=>{if(a.finishTime!=null&&b.finishTime!=null)return a.finishTime-b.finishTime;if(a.finishTime!=null)return -1;if(b.finishTime!=null)return 1;return b.u-a.u;});}
const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return`${m}:${s<10?'0':''}${s.toFixed(2)}`;};
function showResults(){
  const st=standings();const rows=st.map((r,i)=>{const t=r.finishTime!=null?r.finishTime:raceTime+(uF-r.u)/26;return`<tr class="${r.isPlayer?'me':''}"><td>${i+1}</td><td><span class="sw" style="background:${r.css}"></span>${r.name}</td><td>${r.finishTime!=null?'':'约 '}${fmt(t)}</td></tr>`;}).join('');
  document.getElementById('resTable').innerHTML=rows;document.getElementById('placeTxt').textContent=`第 ${st.indexOf(player)+1} 名`;
  result.hidden=false;touchEl.hidden=true;state='results';setTimeout(()=>document.getElementById('againBtn').focus(),50);}

// ---------- camera ----------
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let camInit=false,fov=68;
function updateCamera(dt){
  const b=player;const px=b.mesh.position.x,py=b.wy,pz=b.mesh.position.z;
  let tx,ty,tz,lx,ly,lz;
  if(state==='menu'){const a=time*0.15;tx=px+Math.sin(a)*14;tz=pz+Math.cos(a)*14;ty=py+5;lx=px;ly=py+1;lz=pz;}
  else{tx=px-b.dirx*9;ty=py+4.3;tz=pz-b.dirz*9;lx=px+b.dirx*8;ly=py+1.2;lz=pz+b.dirz*8;}
  const k=camInit?1-Math.exp(-dt*(state==='menu'?2:5)):1;camInit=true;
  camPos.x=lerp(camPos.x,tx,k);camPos.y=lerp(camPos.y,ty,k);camPos.z=lerp(camPos.z,tz,k);
  camLook.x=lerp(camLook.x,lx,k);camLook.y=lerp(camLook.y,ly,k);camLook.z=lerp(camLook.z,lz,k);
  camera.position.copy(camPos);
  if(shake>0){shake=Math.max(0,shake-dt);const m=shake*0.6;camera.position.x+=(Math.random()-0.5)*m;camera.position.y+=(Math.random()-0.5)*m;}
  camera.lookAt(camLook);
  const tf=68+(b.boostT>0?12:0)+Math.max(0,b.v-15)*0.25;fov=lerp(fov,tf,1-Math.exp(-dt*4));camera.fov=fov;camera.updateProjectionMatrix();
}

// ---------- main loop ----------
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
resetRace();
let last=performance.now(),lastPlace=-1,lastItem='';
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;time+=dt;
  // world animation
  waterTex.offset.y-=dt*6/18;foamTex.offset.y-=dt*12/11;
  for(const bx of boxes){if(!bx.active){bx.t-=dt;if(bx.t<=0){bx.active=true;bx.mesh.visible=true;}}else{bx.mesh.rotation.y+=dt*1.6;bx.mesh.rotation.x=Math.sin(time*1.3+bx.u)*0.3;bx.mesh.position.y=bx.y+Math.sin(time*2+bx.u)*0.25;}}
  for(const r of rocks){const k=1+Math.sin(time*4+r.u)*0.12;r.ring.scale.set(r.base*k,1,r.base*k);}

  if(state==='countdown'){countT-=dt;const n=Math.ceil(countT-0.6);
    if(countT>0.6){if(ui.msg.textContent!==String(n))say(String(n),1);}else{say('出发！',0.8);state='race';}}
  if(state==='race'||state==='finished'||state==='results'){
    raceTime+=state==='race'?dt:0;if(state!=='race')raceTime+=dt;
    // player input
    if(state==='race'){
      const kb=(keys['arrowup']||keys['w'])?1:0,bk=(keys['arrowdown']||keys['s']||touch.brake)?1:0;
      player.throttle=isTouch?(bk?-1:1):(kb-bk);
      const st=((keys['arrowright']||keys['d']||touch.r)?1:0)-((keys['arrowleft']||keys['a']||touch.l)?1:0);
      player.steer=lerp(player.steer,st,1-Math.exp(-dt*10));
      player.wantDrift=!!(keys['shift']||touch.drift);
      if(itemPressed)useItem(player);
    }else aiControl(player,dt);
    itemPressed=false;
    const st=standings();st.forEach((r,i)=>r.place=i);
    for(const b of racers){if(!b.isPlayer){b.rubber=1+clamp((player.u-b.u)/350,-0.07,0.1);aiControl(b,dt);}else b.rubber=1;}
    for(const b of racers)physics(b,dt);
    boatCollisions();
    if(state==='finished'){resultT-=dt;if(resultT<=0||racers.every(r=>r.finishTime!=null))showResults();}
  }else{itemPressed=false;}
  for(const b of racers)updateMesh(b,dt);
  updateParticles(dt);
  updateCamera(dt);

  // HUD
  if(!hud.hidden){
    const place=standings().indexOf(player)+1;if(place!==lastPlace){ui.pos.innerHTML=`${place}<span>/${racers.length}</span>`;lastPlace=place;}
    sample(player.u,sv);ui.spd.innerHTML=`${Math.round(Math.max(0,player.v*Math.cos(player.h)+sv.cur)*1.25)}<small> km/h</small>`;
    ui.time.textContent=fmt(raceTime);
    const itKey=player.item?player.item.id+player.item.n:'';
    if(itKey!==lastItem){lastItem=itKey;if(player.item){const d=ITEMS[player.item.id];ui.slot.innerHTML=player.item.id==='turbo3'?`加速<br>×${player.item.n}`:d.label;ui.slot.className=d.cls;}else{ui.slot.textContent='空';ui.slot.className='';}}
    const c=player.drift.on?player.drift.charge:0;ui.drift.style.width=Math.min(100,c/2*100)+'%';ui.drift.style.background=c>2?'#ff7a1a':c>1?'#3fd0ff':'#a6d2d6';
    for(const r of racers)r.dot.style.left=clamp((r.u-uStart)/(uF-uStart),0,1)*100+'%';
    drawMap();
  }
  if(msgT>0){msgT-=dt;if(msgT<=0)ui.msg.classList.remove('show');}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game={racers,get state(){return state},startRace,L,uF};
})();
</script>
